[package]
name = "distr-hnsw-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-partition vector engine: flat storage, distance kernels, exact oracle, HNSW"
publish = false

[dependencies]
blake3 = "1"
bytemuck = "1"
crc32c = "0.6"
memmap2 = "0.9"
parking_lot = "0.12"
rayon = "1"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
