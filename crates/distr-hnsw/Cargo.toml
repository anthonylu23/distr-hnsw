[package]
name = "distr-hnsw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-hosted distributed semantic storage service"
publish = false

[[bin]]
name = "distr-hnsw"
path = "src/main.rs"

[features]
# Honor DISTR_HNSW_FAILPOINT in release builds (debug builds always do).
failpoints = []

[dependencies]
anyhow = "1"
# Default features would add a second, legacy hyper 0.14 / rustls 0.21 stack
# next to the hyper 1 / rustls 0.23 one; only the latter is wanted.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
zeroize = "1"
uuid = { version = "1", features = ["serde", "v4"] }
distr-hnsw-index = { version = "0.1.0", path = "../distr-hnsw-index" }

[dev-dependencies]
tempfile = "3"
