[package]
name = "distr-hnsw-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmark harness for the distr-hnsw vector engine against pinned datasets"
publish = false

[[bin]]
name = "distr-hnsw-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
distr-hnsw-index = { path = "../distr-hnsw-index" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
