[workspace]
resolver = "2"
members = ["crates/distr-hnsw", "crates/distr-hnsw-index", "crates/distr-hnsw-bench", "prototype"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/anthonylu23/distr-hnsw"

# Argon2id is unusably slow unoptimized; recovery-bundle tests would take
# minutes. Optimize the KDF crates even in dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Ed25519 signs and verifies every grant; unoptimized, the grant property
# tests and the agent authorization tests spend most of their time here.
[profile.dev.package.curve25519-dalek]
opt-level = 3
